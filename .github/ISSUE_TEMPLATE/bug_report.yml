name: Bug Report
description: Report a bug in mini-eq
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the details below.
  - type: input
    id: version
    attributes:
      label: mini-eq Version
      description: What version of mini-eq are you running? (e.g., 0.1.0, git commit hash)
      placeholder: "e.g., 0.1.0 or git commit hash"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: "Describe the bug..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run 'mini-eq --background --auto-route'
        2. ...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
      placeholder: "Expected behavior..."
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened.
      placeholder: "Actual behavior..."
  - type: textarea
    id: logs
    attributes:
      label: Logs / Output
      description: Relevant log output. Use `--verbose` flag if available.
      placeholder: "Paste logs here..."
      render: shell
  - type: textarea
    id: system
    attributes:
      label: System Information
      description: PipeWire version, GTK version, OS, etc.
      placeholder: |
        - PipeWire: 1.0.x
        - GTK: 4.x
        - OS: Ubuntu 24.04
        - Architecture: x86_64
  - type: checkbox
    attributes:
      label: I have checked existing issues
      description: I have searched the existing issues and believe this is not a duplicate.
      options:
        - label: "I have checked existing issues"
          required: true
