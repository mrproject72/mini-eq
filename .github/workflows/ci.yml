name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libgraphene-1.0-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libdbus-1-dev \
            libssl-dev \
            pkg-config
      - name: Check format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Check
        run: cargo check --release
      - name: Test
        run: cargo test --lib
      - name: Build
        run: cargo build --release
